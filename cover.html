<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Cover</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111827; /* Matches your preferred dark theme */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .cover-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            max-height: 900px;
            background-color: #1f2937;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            border: 1px solid #374151;
        }
        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the whole picture fits without cropping */
            border-radius: 4px;
        }
    </style>

    <style>
        .book-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #374151;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .nav-btn {
            background-color: #374151;
            color: #f3f4f6;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .nav-btn:hover {
            background-color: #4b5563;
        }
        .nav-info {
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
    
</head>
<body>
    <div class="cover-container">
        <img src="cover.jpg" alt="Book Cover" class="cover-image">
    </div>

    <div class="book-navigation">
        <span class="nav-info">1 of 18</span> <a href="00_copyright.html" class="nav-btn">Next &rarr;</a>
    </div>
    
</body>
</html>
